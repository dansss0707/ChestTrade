<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER CRATE // OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f12;
      --surface: #14181d;
      --surface-border: #232832;
      --surface-hover: #1b2028;
      --text-main: #dce1eb;
      --text-muted: #626c7e;
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.12);
      
      --rarity-common: #717d91;
      --rarity-rare: #00d4ff;
      --rarity-epic: #c86eff;
      --rarity-legendary: #ffaa00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Scanline effect */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1000;
      opacity: 0.6;
    }

    /* TOP BAR / TERMINAL HEADER */
    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 4px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand .indicator {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-balance {
      font-size: 0.85rem;
      font-weight: 700;
      background: #090b0e;
      border: 1px solid var(--surface-border);
      padding: 6px 12px;
      border-radius: 4px;
      color: var(--accent);
      margin-left: 8px;
    }

    /* BUTTONS */
    .btn {
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 7px 14px;
      border-radius: 3px;
      border: 1px solid var(--surface-border);
      background: #181d24;
      color: var(--text-main);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: #3e4656;
      color: #fff;
    }

    .btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn-action {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 800;
    }

    .btn-action:hover {
      background: #00e077;
      border-color: #00e077;
      color: #000;
    }

    .btn-block {
      width: 100%;
      display: block;
      padding: 9px 0;
      margin-top: 12px;
    }

    /* PANELS */
    .panel-view {
      width: 100%;
      max-width: 960px;
      display: none;
    }

    .panel-view.active {
      display: block;
    }

    /* CRATE CATALOG */
    #chest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .crate-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 4px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: border-color 0.15s, transform 0.15s;
    }

    .crate-card:hover {
      border-color: #384252;
      transform: translateY(-2px);
    }

    .crate-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .crate-icon-box {
      width: 64px;
      height: 64px;
      margin: 10px auto 14px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0c0f;
      border: 1px solid var(--surface-border);
      border-radius: 3px;
    }

    .crate-icon-box img {
      max-width: 38px;
      max-height: 38px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .crate-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .crate-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.45;
      flex-grow: 1;
      margin-bottom: 12px;
    }

    /* VAULT INVENTORY */
    .vault-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    #vault-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .vault-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 3px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: border-color 0.15s;
    }

    .vault-card:hover {
      border-color: #3b4557;
    }

    .rarity-pill {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
      margin-top: 8px;
    }

    .rarity-common { color: var(--rarity-common); border-left: 2px solid var(--rarity-common); }
    .rarity-rare { color: var(--rarity-rare); border-left: 2px solid var(--rarity-rare); }
    .rarity-epic { color: var(--rarity-epic); border-left: 2px solid var(--rarity-epic); }
    .rarity-legendary { color: var(--rarity-legendary); border-left: 2px solid var(--rarity-legendary); }

    /* ================= OPENING OVERLAY ================= */
    #modal-opening, #modal-trading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 11, 14, 0.94);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #cards-container {
      display: flex;
      gap: 20px;
      margin: 28px 0;
    }

    .pick-card {
      width: 170px;
      height: 240px;
      background: #111419;
      border: 1px solid #29303d;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 14px;
      text-align: center;
      transition: transform 0.15s, border-color 0.15s, opacity 0.3s;
      position: relative;
    }

    .pick-card:hover:not(.revealed) {
      border-color: #4b586e;
      transform: translateY(-4px);
    }

    .pick-card.revealed {
      cursor: default;
    }

    .pick-card.missed {
      opacity: 0.3;
      filter: grayscale(1);
    }

    .pick-card.legendary-hit {
      border-color: var(--rarity-legendary);
      box-shadow: 0 0 24px rgba(255, 170, 0, 0.2);
    }

    /* TRADING MODAL */
    .trade-window {
      background: #12151b;
      border: 1px solid var(--surface-border);
      border-radius: 4px;
      width: 90%;
      max-width: 640px;
      padding: 20px;
      color: var(--text-main);
    }

    .trade-input {
      width: 100%;
      background: #090b0e;
      border: 1px solid var(--surface-border);
      color: #fff;
      padding: 9px 12px;
      font-size: 0.82rem;
      border-radius: 3px;
      outline: none;
      margin-top: 6px;
    }

    .trade-input:focus {
      border-color: #444f63;
    }

    .trade-vault-shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      padding: 8px;
      background: #090b0e;
      border: 1px solid var(--surface-border);
      border-radius: 3px;
      margin-top: 6px;
    }

    .trade-shelf-item {
      background: #14181f;
      border: 1px solid var(--surface-border);
      padding: 8px;
      text-align: center;
      font-size: 0.7rem;
      cursor: pointer;
      border-radius: 2px;
    }

    .trade-shelf-item:hover {
      border-color: #3b4657;
    }

    .trade-shelf-item.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: #fff;
    }

    .trade-inbox-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1015;
      border: 1px solid var(--surface-border);
      padding: 10px 12px;
      border-radius: 3px;
      margin-top: 8px;
      font-size: 0.78rem;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://nsmljllkktkphqcpmwda.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_c8CWz4tqfppmApJxJekO_Q_lDsIci8C";

    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.AppState = window.AppState || {
      user: null,
      profile: { coins: 0 }
    };

    async function syncSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        AppState.user = session.user;
        const { data: profile } = await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", session.user.id)
          .single();
        if (profile) AppState.profile = profile;
      }
      updateHUD();
    }

    function updateHUD() {
      const coins = AppState.profile ? (AppState.profile.coins || 0) : 0;
      const coinEl = document.getElementById("user-coins");
      if (coinEl) coinEl.innerText = coins;
    }

    window.AppUI = {
      updateHUD: updateHUD,
      switchTab: function(tabName) {
        document.querySelectorAll(".panel-view").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".nav-group .btn").forEach(b => b.classList.remove("active"));
        
        var panel = document.getElementById("panel-" + tabName);
        var btn = document.getElementById("nav-btn-" + tabName);
        if (panel) panel.classList.add("active");
        if (btn) btn.classList.add("active");

        if (tabName === "vault" && window.AppChest && AppChest.loadVault) {
          AppChest.loadVault();
        }
      }
    };

    document.addEventListener("DOMContentLoaded", async () => {
      await syncSession();
      if (window.AppChest && AppChest.init) {
        AppChest.init();
      }
    });
  </script>
</head>
<body>

  <!-- TERMINAL HEADER -->
  <header>
    <div class="brand">
      <div class="indicator"></div>
      <span>SYS.CRATES // V2</span>
    </div>

    <div class="nav-group">
      <button id="nav-btn-crates" class="btn active" onclick="AppUI.switchTab('crates')">CATALOG</button>
      <button id="nav-btn-vault" class="btn" onclick="AppUI.switchTab('vault')">VAULT</button>
      <button class="btn" onclick="AppChest.openTradeModal()">TRADE</button>
      <div class="hud-balance">
        <span id="user-coins">0</span> CR
      </div>
    </div>
  </header>

  <!-- PANEL: CRATES -->
  <section id="panel-crates" class="panel-view active">
    <main id="chest-grid"></main>
  </section>

  <!-- PANEL: VAULT -->
  <section id="panel-vault" class="panel-view">
    <div class="vault-bar">
      <span>SECURE STORAGE // ACTIVE ITEMS</span>
      <button class="btn" onclick="AppChest.loadVault()">RESCAN</button>
    </div>
    <div id="vault-grid"></div>
  </section>

  <!-- PACK OPENING MODAL -->
  <div id="modal-opening">
    <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 6px;">
      EXTRACTION IN PROGRESS
    </div>
    <h2 id="opening-chest-name" style="font-size: 1.15rem; color: #fff; font-weight: 800; margin-bottom: 10px;"></h2>

    <div id="cards-container"></div>

    <button id="btn-collect-loot" class="btn btn-action" style="display: none; padding: 10px 24px;" onclick="AppChest.collectAndClose()">
      CONFIRM & STORE
    </button>
  </div>

  <!-- TRADING TERMINAL -->
  <div id="modal-trading">
    <div class="trade-window">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); padding-bottom: 10px; margin-bottom: 14px;">
        <span style="font-weight: 800; font-size: 0.85rem; letter-spacing: 0.5px;">SECURE TRADE PROTOCOL</span>
        <button class="btn" onclick="AppChest.closeTradeModal()" style="padding: 2px 8px;">✕</button>
      </div>

      <div>
        <label style="font-size: 0.72rem; color: var(--text-muted);">FIND RECIPIENT USERNAME</label>
        <input type="text" id="trade-search-input" class="trade-input" placeholder="Type username..." oninput="AppChest.searchUsers(this.value)">
        <div id="trade-user-results" style="margin-top: 6px;"></div>
      </div>

      <div id="trade-stage" style="display: none; border-top: 1px solid var(--surface-border); padding-top: 14px; margin-top: 14px;">
        <div id="trade-target-username" style="font-size: 0.78rem; font-weight: 700; color: var(--accent); margin-bottom: 8px;"></div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <span style="font-size: 0.7rem; color: var(--text-muted);">GIVE:</span>
            <div id="trade-my-items" class="trade-vault-shelf"></div>
          </div>
          <div>
            <span style="font-size: 0.7rem; color: var(--text-muted);">RECEIVE:</span>
            <div id="trade-their-items" class="trade-vault-shelf"></div>
          </div>
        </div>

        <button class="btn btn-action btn-block" onclick="AppChest.sendTradeOffer()">
          SEND PROPOSAL
        </button>
      </div>

      <div style="margin-top: 18px; border-top: 1px solid var(--surface-border); padding-top: 12px;">
        <span style="font-size: 0.72rem; color: var(--text-muted);">ACTIVE TRANSFERS</span>
        <div id="trade-inbox-list"></div>
      </div>
    </div>
  </div>

  <script src="js/ChestMain.js"></script>
</body>
</html>
