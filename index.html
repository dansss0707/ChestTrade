<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Crate Drop</title>
  <style>
    :root {
      --bg: #090a10;
      --card-bg: rgba(18, 21, 35, 0.75);
      --border: #232942;
      --text: #e2e8f0;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --common: #94a3b8;
      --rare: #38bdf8;
      --epic: #c084fc;
      --legendary: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #15192e 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 35px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-coins {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #chest-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--accent-glow), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #4f46e5;
      box-shadow: 0 12px 35px var(--accent-glow);
    }

    .card:hover::before {
      opacity: 1;
    }

    .btn {
      cursor: pointer;
      font-weight: 800;
      border-radius: 8px;
      border: none;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    .btn-primary:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.7);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #475569;
    }

    .btn-block {
      width: 100%;
      padding: 10px 0;
      letter-spacing: 1px;
    }

    /* ================= OPENING MODAL ================= */
    #modal-opening, #modal-trading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 10, 0.92);
      backdrop-filter: blur(14px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      perspective: 1200px;
    }

    @keyframes screen-shake {
      0% { transform: scale(1) translate(0, 0); }
      15% { transform: scale(1.02) translate(-6px, 4px); }
      30% { transform: scale(1.02) translate(6px, -4px); }
      45% { transform: scale(1.01) translate(-4px, 2px); }
      60% { transform: scale(1.005) translate(3px, -2px); }
      100% { transform: scale(1) translate(0, 0); }
    }

    .shake-impact {
      animation: screen-shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .god-rays {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 900px;
      height: 900px;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 255, 255, 0.08) 0deg 12deg,
        transparent 12deg 24deg
      );
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 1;
    }

    .god-rays.active {
      opacity: 1;
      animation: ray-spin 20s linear infinite;
    }

    @keyframes ray-spin {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    #cards-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      z-index: 2;
      padding: 30px 10px;
    }

    .flip-card {
      width: 170px;
      height: 250px;
      cursor: pointer;
      perspective: 1200px;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .flip-card:hover:not(.flipped) {
      transform: translateY(-10px) scale(1.06);
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card.missed {
      opacity: 0.35;
      filter: grayscale(70%);
      transform: scale(0.92);
      pointer-events: none;
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .flip-card-front {
      background: radial-gradient(circle at 50% 25%, #242940, #0d1017);
      border: 2px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .mystery-icon {
      font-size: 3rem;
      animation: pulse-gem 1.8s infinite ease-in-out;
    }

    @keyframes pulse-gem {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4)); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.8)); }
    }

    .flip-card-back {
      transform: rotateY(180deg);
      background: #10121d;
      overflow: hidden;
      position: relative;
    }

    .flip-card-back::after {
      content: "";
      position: absolute;
      inset: -150%;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.15) 38%,
        rgba(255, 255, 255, 0.5) 45%,
        rgba(255, 255, 255, 0.15) 52%,
        transparent 70%
      );
      transform: rotate(30deg);
      pointer-events: none;
      opacity: 0;
    }

    .flip-card.flipped .flip-card-back::after {
      animation: holo-pass 1.3s cubic-bezier(0.19, 1, 0.22, 1) 0.3s forwards;
    }

    @keyframes holo-pass {
      0% { transform: translateY(-70%) rotate(30deg); opacity: 0; }
      25% { opacity: 0.9; }
      100% { transform: translateY(70%) rotate(30deg); opacity: 0; }
    }

    .rarity-common {
      border: 2px solid var(--common);
      box-shadow: 0 0 15px rgba(148, 163, 184, 0.4);
    }

    .rarity-rare {
      border: 2px solid var(--rare);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.65), inset 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .rarity-epic {
      border: 2px solid var(--epic);
      box-shadow: 0 0 35px rgba(192, 132, 252, 0.8), inset 0 0 15px rgba(192, 132, 252, 0.4);
      animation: pulse-epic 1.8s infinite alternate;
    }

    .rarity-legendary {
      border: 2px solid var(--legendary);
      box-shadow: 0 0 45px rgba(251, 191, 36, 0.95), inset 0 0 20px rgba(251, 191, 36, 0.5);
      animation: pulse-legendary 1.4s infinite alternate;
    }

    @keyframes pulse-epic {
      from { box-shadow: 0 0 25px rgba(192, 132, 252, 0.6); }
      to { box-shadow: 0 0 40px rgba(192, 132, 252, 1); }
    }

    @keyframes pulse-legendary {
      0% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.7), 0 0 10px #fff; }
      100% { box-shadow: 0 0 60px rgba(251, 191, 36, 1), 0 0 25px #ff5500; }
    }

    .pixel-tag {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* ================= TRADING MODAL ================= */
    .trade-modal-window {
      background: #111422;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 90%;
      max-width: 680px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px var(--accent-glow);
      max-height: 88vh;
      overflow-y: auto;
      z-index: 10;
    }

    .trade-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .trade-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .trade-inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid #1e293b;
      border-radius: 8px;
      margin-top: 6px;
    }

    .trade-slot-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 65px;
    }

    .trade-slot-card:hover {
      border-color: #6366f1;
      transform: translateY(-2px);
    }

    .trade-slot-card.selected {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .trade-inbox-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>

  <!-- 1. Supabase JS CDN Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Supabase Client & AppState Setup -->
  <script>
    // FILL THESE TWO VALUES WITH YOUR ACTUAL SUPABASE PROJECT CREDENTIALS:
    const SUPABASE_URL = "https://nsmljllkktkphqcpmwda.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_c8CWz4tqfppmApJxJekO_Q_lDsIci8C";

    // Initialize client globally on window so every script can access it
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Global session state
    window.AppState = window.AppState || {
      user: null,
      profile: { coins: 0 }
    };

    // Keep session and profile synced
    async function syncSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        AppState.user = session.user;
        const { data: profile } = await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", session.user.id)
          .single();
        if (profile) {
          AppState.profile = profile;
          const coinEl = document.getElementById("user-coins");
          if (coinEl) coinEl.innerText = profile.coins || 0;
        }
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await syncSession();
      if (window.AppChest && AppChest.init) {
        AppChest.init();
      }
    });
  </script>
</head>
<body>

  <header>
    <div class="brand-title">CYBER CRATES</div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="AppChest.openTradeModal()">🔄 TRADE POST</button>
      <div class="hud-coins" id="hud-coins">🪙 <span id="user-coins">0</span>G</div>
    </div>
  </header>

  <main id="chest-grid"></main>

  <!-- PACK OPENING MODAL -->
  <div id="modal-opening">
    <div id="god-rays" class="god-rays"></div>

    <h2 id="opening-chest-name" style="font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin-bottom: 20px; z-index: 2; text-shadow: 0 0 15px rgba(255,255,255,0.4);">
      SELECT YOUR CARD
    </h2>

    <div id="cards-container"></div>

    <button id="btn-collect-loot" class="btn btn-primary" style="display: none; margin-top: 25px; z-index: 2; font-size: 1rem; padding: 12px 30px; letter-spacing: 1.5px;" onclick="AppChest.collectAndClose()">
      CLAIM ITEM
    </button>
  </div>

  <!-- PLAYER TRADING MODAL -->
  <div id="modal-trading">
    <div class="trade-modal-window">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 16px;">
        <h2 style="font-size: 1.1rem; letter-spacing: 1.5px; font-weight: 800;">PLAYER TRADING TERMINAL</h2>
        <button class="btn btn-secondary" onclick="AppChest.closeTradeModal()" style="padding: 4px 10px;">✕</button>
      </div>

      <!-- Player Search -->
      <div>
        <label style="font-size: 0.75rem; font-weight: 800; color: #94a3b8; letter-spacing: 1px;">SEARCH OPERATIVE BY USERNAME</label>
        <input type="text" id="trade-search-input" class="trade-input" placeholder="Type username..." oninput="AppChest.searchUsers(this.value)">
        <div id="trade-user-results" style="margin-top: 8px;"></div>
      </div>

      <!-- Live 1v1 Trade Floor -->
      <div id="trade-stage" style="display: none; border-top: 1px solid #334155; padding-top: 16px; margin-top: 16px;">
        <h3 id="trade-target-username" style="font-size: 0.9rem; color: #38bdf8; margin-bottom: 12px; letter-spacing: 1px;"></h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div>
            <span style="font-size: 0.75rem; font-weight: 800; color: #a855f7;">YOU OFFER:</span>
            <div id="trade-my-items" class="trade-inventory-grid"></div>
          </div>
          <div>
            <span style="font-size: 0.75rem; font-weight: 800; color: #38bdf8;">THEY OFFER:</span>
            <div id="trade-their-items" class="trade-inventory-grid"></div>
          </div>
        </div>

        <button class="btn btn-primary btn-block" style="margin-top: 16px; padding: 12px 0;" onclick="AppChest.sendTradeOffer()">
          TRANSMIT PROPOSAL
        </button>
      </div>

      <!-- Proposals Inbox -->
      <div style="margin-top: 24px; border-top: 1px solid #334155; padding-top: 14px;">
        <h3 style="font-size: 0.8rem; letter-spacing: 1.5px; font-weight: 800; color: #94a3b8; margin-bottom: 10px;">ACTIVE PROPOSALS</h3>
        <div id="trade-inbox-list"></div>
      </div>
    </div>
  </div>

  <!-- 3. Logic script loaded after Supabase initialization -->
  <script src="js/ChestMain.js"></script>
</body>
</html>
