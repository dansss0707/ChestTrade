<!-- ================= AUTH VIEW ================= -->
  <div id="view-auth" class="modal-overlay">
    <div class="card auth-box">
      <div class="pixel-badge">v0.1-alpha</div>
      <h2 id="auth-title">POCKET VAULT</h2>
      <p class="subtitle">Enter username & key to enter the economy</p>
      
      <div class="input-group">
        <label>USERNAME</label>
        <input type="text" id="auth-username" placeholder="CollectorTag" autocomplete="off" spellcheck="false">
      </div>
      
      <div class="input-group">
        <label>SECRET PASSKEY</label>
        <div class="password-wrapper">
          <input type="password" id="auth-password" placeholder="••••••••">
          <button type="button" id="btn-peek-password" class="btn-peek" onclick="AppAuth.togglePasswordVisibility()" title="Show/Hide Password">👁️</button>
        </div>
      </div>
      
      <div class="btn-group">
        <button id="btn-login" class="btn btn-primary" onclick="AppAuth.login()">ENTER GAME</button>
        <button id="btn-register" class="btn btn-secondary" onclick="AppAuth.register()">NEW SAVE</button>
      </div>

      <p id="auth-error" class="status-msg danger"></p>
    </div>
  </div>
